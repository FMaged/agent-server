#_preseed_V1
# Unattended Debian 13 (trixie) install for agent-server.
# Boot the installer in UEFI mode: partman-auto picks its recipe from the
# firmware mode, and a BIOS/CSM boot produces a layout UEFI will not boot.

### Localization
d-i debian-installer/language string en
d-i debian-installer/country string DE
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Clock and time zone
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Berlin
d-i clock-setup/ntp boolean true

### Network
d-i netcfg/choose_interface select auto
# Must precede the static answers, or DHCP overrides them.
d-i netcfg/disable_autoconfig boolean true
d-i netcfg/get_ipaddress string 192.168.150.221
d-i netcfg/get_netmask string 255.255.255.0
d-i netcfg/get_gateway string 192.168.150.1
d-i netcfg/get_nameservers string 192.168.150.1
d-i netcfg/confirm_static boolean true
d-i netcfg/get_hostname string agent-server
# Wins over a hostname handed out by DHCP; get_hostname alone does not.
d-i netcfg/hostname string agent-server
# Set even when empty, or the installer asks for it.
d-i netcfg/get_domain string
d-i hw-detect/load_firmware boolean true

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Accounts
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Ansible
d-i passwd/username string ansible
# Bootstrap login for the first playbook run, which replaces it with a key.
d-i passwd/user-password-crypted password $6$P4bzVNy1UgWVXvXE$67/aa9hxuw2mOMn2u7AO59Lx5c6GgBdOqIf2j1w6t/hVcalDNXLgPQga92mdnANWDFDzFsZm6cYFqkXTi7Rhx1
# Replaces the stock group list rather than adding to it.
d-i passwd/user-default-groups string sudo

### Partitioning
d-i partman-auto/method string regular
# Pinned rather than inherited from the release default.
d-i partman/default_filesystem string ext4
# Check this against the target machine before installing.
d-i partman-auto/disk string /dev/sda
# ESP 1 GB, swap 8 GB, ext4 root on the rest.
d-i partman-auto/choose_recipe select agent-server
d-i partman-auto/expert_recipe string \
    agent-server :: \
        1024 1024 1024 free \
            $iflabel{ gpt } $reusemethod{ } method{ efi } format{ } . \
        8192 8192 8192 linux-swap \
            $reusemethod{ } method{ swap } format{ } . \
        4096 10000 -1 ext4 \
            method{ format } format{ } use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ / } .

# Discard any LVM or RAID the disk already carries, without asking.
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true

d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Bootloader
# grub-installer/bootdev stays unset: preseeding it marks the question seen,
# which disables the check against installing to the removable install medium.
d-i grub-installer/only_debian boolean true
d-i grub-installer/force-efi-extra-removable boolean true

### Package selection
tasksel tasksel/first multiselect standard, ssh-server
# Priority: optional, so the standard task guarantees neither; Ansible needs both.
d-i pkgsel/include string sudo python3
d-i pkgsel/upgrade select safe-upgrade
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

### Apt setup
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/cdrom/set-first boolean false

d-i finish-install/reboot_in_progress note
