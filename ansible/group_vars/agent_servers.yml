ansible_user: ansible
ansible_become: true
ansible_ssh_private_key_file: ~/.ssh/agent-server

# Written whole to authorized_keys, so dropping a key here removes it from the host.
agent_ssh_public_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIXmv+F9H41hrVP+cZGGgIaz7R7nltqySrdC+CrapVT6 agent-server"

base_packages:
  - ca-certificates
  - curl
  - git
  - rsync
  - vim

# llama.cpp's CPU server image, pinned by digest. The tag is for people; Docker
# uses the digest. To pin a newer release, take its server-b<N> tag and digest,
# and check the image's org.opencontainers.image.revision label is the release's
# commit. README.md shows how.
llm_image: ghcr.io/ggml-org/llama.cpp:server-b11960@sha256:8052c13edd987de8858f8150031e025ac3d66823f09cf3ec8220899c4abce220
llm_compose_dir: /opt/llama-server
llm_models_dir: /srv/llama/models
llm_key_file: /etc/llama/api-key
llm_bind: 192.168.150.221
llm_port: 8080
llm_threads: 2
llm_ctx: 16384
# Kept free on the models' filesystem after every download, in bytes (5 GiB).
llm_disk_reserve: 5368709120
# Seconds the chat check may take; CPU generation is slow.
llm_check_timeout: 120

# Weights are never committed. Each entry is one GGUF file (no split models),
# pinned by sha256; size is its size in bytes, for the free-space check. A new
# revision of a model gets a new key and a new file name, so it never
# overwrites the file a rollback needs. Sizes and sums come from the Hugging
# Face API: https://huggingface.co/api/models/<repo>/tree/main
llm_models:
  qwen3-coder-30b-a3b:
    file: Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
    url: https://huggingface.co/unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF/resolve/main/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
    sha256: fadc3e5f8d42bf7e894a785b05082e47daee4df26680389817e2093056f088ad
    size: 18556689568
  qwen3-8b:
    file: Qwen3-8B-Q4_K_M.gguf
    url: https://huggingface.co/unsloth/Qwen3-8B-GGUF/resolve/main/Qwen3-8B-Q4_K_M.gguf
    sha256: 120307ba529eb2439d6c430d94104dabd578497bc7bfe7e322b5d9933b449bd4
    size: 5027784512
  qwen3-0.6b:
    file: Qwen3-0.6B-Q4_K_M.gguf
    url: https://huggingface.co/unsloth/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_K_M.gguf
    sha256: ac2d97712095a558e31573f62f466a3f9d93990898b0ec79d7c974c1780d524a
    size: 396705472
  deepseek-r1-distill-qwen-7b:
    file: DeepSeek-R1-Distill-Qwen-7B-Q4_K_M.gguf
    url: https://huggingface.co/unsloth/DeepSeek-R1-Distill-Qwen-7B-GGUF/resolve/main/DeepSeek-R1-Distill-Qwen-7B-Q4_K_M.gguf
    sha256: 78272d8d32084548bd450394a560eb2d70de8232ab96a725769b1f9171235c1c
    size: 4683073248

# The model the service runs; a key of llm_models. To switch, change this line
# and run llm.yml: it downloads the new model, recreates the container, checks
# it answers a chat request, then deletes every .gguf that is neither llm_model
# nor in llm_download. Change llm_image and llm_model in separate runs.
llm_model: qwen3-8b
# Extra models to keep on the host besides llm_model.
llm_download: []
