---
- name: Install the base packages
  ansible.builtin.apt:
    name: "{{ base_packages + ['unattended-upgrades'] }}"
    state: present
    update_cache: true

# Owned so the debconf default does not decide.
- name: Turn on the periodic security upgrades
  ansible.builtin.copy:
    content: |
      // Managed by Ansible.
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
