---
- name: Install the base packages
  ansible.builtin.apt:
    name: "{{ base_packages + ['unattended-upgrades'] }}"
    state: present
    update_cache: true

# The package generates this file from a debconf answer, so owning it pins the
# behaviour rather than inheriting whichever default applied at install time.
- name: Turn on the periodic security upgrades
  ansible.builtin.copy:
    content: |
      // Managed by Ansible.
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
