---
# A string here, or an empty list, writes an authorized_keys nobody can log in
# with — and sshd refuses passwords, so there is no fallback.
- name: Check the public key list is a non-empty list
  ansible.builtin.assert:
    that:
      - agent_ssh_public_keys is sequence
      - agent_ssh_public_keys is not string
      - agent_ssh_public_keys | length > 0
    fail_msg: agent_ssh_public_keys must be a non-empty list of key strings.

- name: Keep the ansible user's .ssh directory private
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/.ssh
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Write the ansible user's authorized_keys
  ansible.builtin.copy:
    content: |
      # Managed by Ansible. A key dropped from the list is dropped from here.
      {% for key in agent_ssh_public_keys %}
      {{ key }}
      {% endfor %}
    dest: /home/{{ ansible_user }}/.ssh/authorized_keys
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Grant the ansible user passwordless sudo
  ansible.builtin.copy:
    content: |
      # Managed by Ansible.
      {{ ansible_user }} ALL=(ALL) NOPASSWD:ALL
    dest: /etc/sudoers.d/ansible
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

# The install-time password ships in the preseed, so it is public. Replacing it
# with an invalid hash ends it, and leaves the key as the only credential.
- name: Remove the install-time password
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    password: "*"
