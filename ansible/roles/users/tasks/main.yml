---
# Once password SSH is off, this key is the only way in.
- name: Check the controller's key is in the list
  ansible.builtin.assert:
    that: controller_key in agent_ssh_public_keys | join(' ') | split
    fail_msg: The key for {{ ansible_ssh_private_key_file }} is not in agent_ssh_public_keys.
  vars:
    controller_key: "{{ lookup('pipe', 'ssh-keygen -y -f ' ~ ansible_ssh_private_key_file).split()[1] }}"

- name: Create the ansible user
  ansible.builtin.user:
    name: ansible
    shell: /bin/bash
    create_home: true

- name: Keep the .ssh directories private
  ansible.builtin.file:
    path: /home/{{ item }}/.ssh
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0700"
  loop: [ansible, devel]

- name: Write the authorized_keys
  ansible.builtin.copy:
    content: |
      # Managed by Ansible. A key dropped from the list is dropped from here.
      {% for key in agent_ssh_public_keys %}
      {{ key }}
      {% endfor %}
    dest: /home/{{ item }}/.ssh/authorized_keys
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0600"
  loop: [ansible, devel]

- name: Grant the ansible user passwordless sudo
  ansible.builtin.copy:
    content: |
      # Managed by Ansible.
      ansible ALL=(ALL) NOPASSWD:ALL
    dest: /etc/sudoers.d/ansible
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
