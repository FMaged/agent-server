---
# Without this key on the host, locking the password below locks us out.
- name: Check the controller's key is in the list
  ansible.builtin.assert:
    that: controller_key in agent_ssh_public_keys | join(' ') | split
    fail_msg: The key for {{ ansible_ssh_private_key_file }} is not in agent_ssh_public_keys.
  vars:
    controller_key: "{{ lookup('pipe', 'ssh-keygen -y -f ' ~ ansible_ssh_private_key_file).split()[1] }}"

- name: Keep the ansible user's .ssh directory private
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/.ssh
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Write the ansible user's authorized_keys
  ansible.builtin.copy:
    content: |
      # Managed by Ansible. A key dropped from the list is dropped from here.
      {% for key in agent_ssh_public_keys %}
      {{ key }}
      {% endfor %}
    dest: /home/{{ ansible_user }}/.ssh/authorized_keys
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Grant the ansible user passwordless sudo
  ansible.builtin.copy:
    content: |
      # Managed by Ansible.
      {{ ansible_user }} ALL=(ALL) NOPASSWD:ALL
    dest: /etc/sudoers.d/ansible
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

# The bootstrap password is public; `*` ends it.
- name: Remove the install-time password
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    password: "*"

- name: Look up devel's password
  ansible.builtin.getent:
    database: shadow
    key: devel
    fail_key: false

# Asks only while devel is missing or locked, so a set password is never reset.
- name: Ask for devel's password
  ansible.builtin.pause:
    prompt: Password for devel
    echo: false
  register: users_devel_password
  when: ansible_facts.getent_shadow.devel is none or ansible_facts.getent_shadow.devel[0] is match('[!*]')

- name: Create the devel user
  ansible.builtin.user:
    name: devel
    groups: sudo
    append: true
    shell: /bin/bash
    create_home: true
    password: "{{ users_devel_password.user_input | password_hash('sha512') if users_devel_password.user_input | default('') else omit }}"
  no_log: true

- name: Keep devel's .ssh directory private
  ansible.builtin.file:
    path: /home/devel/.ssh
    state: directory
    owner: devel
    group: devel
    mode: "0700"

- name: Write devel's authorized_keys
  ansible.builtin.copy:
    content: |
      # Managed by Ansible. A key dropped from the list is dropped from here.
      {% for key in agent_ssh_public_keys %}
      {{ key }}
      {% endfor %}
    dest: /home/devel/.ssh/authorized_keys
    owner: devel
    group: devel
    mode: "0600"
