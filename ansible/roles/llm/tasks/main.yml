---
- name: Check the selected model before changing the host
  ansible.builtin.assert:
    that:
      - llm_model in llm_models
      - llm_download | difference(llm_models.keys() | list) | length == 0
    fail_msg: "llm_model and llm_download must be keys of llm_models: {{ llm_models.keys() | list }}"
    quiet: true

- name: Install the build packages
  ansible.builtin.apt:
    name: "{{ llm_build_packages }}"
    state: present
    update_cache: true

- name: Create the llama user
  ansible.builtin.user:
    name: llama
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Clone llama.cpp at the tag
  ansible.builtin.git:
    repo: "{{ llm_repo }}"
    dest: "{{ llm_src_dir }}"
    version: "{{ llm_tag }}"
    depth: 1
  register: llm_clone

# Always run: cmake is incremental, so an unchanged tree is a quick no-op, and a
# build that failed last time is finished now. Restart only if a binary changed.
- name: Build llama-server and llama-bench
  ansible.builtin.shell: |
    set -e
    before=$(sha256sum build/bin/llama-server build/bin/llama-bench 2>/dev/null || true)
    cmake -B build -DGGML_NATIVE=ON -DCMAKE_BUILD_TYPE=Release
    cmake --build build --target llama-server llama-bench -j"$(nproc)"
    test -x build/bin/llama-server
    test -x build/bin/llama-bench
    after=$(sha256sum build/bin/llama-server build/bin/llama-bench)
    [ "$before" = "$after" ] || echo rebuilt
  args:
    chdir: "{{ llm_src_dir }}"
    executable: /bin/bash
  register: llm_build
  changed_when: "'rebuilt' in llm_build.stdout"
  notify: Restart llama-server

- name: Create the models directory
  ansible.builtin.file:
    path: "{{ llm_models_dir }}"
    state: directory
    owner: root
    group: llama
    mode: "0750"

- name: Download the models
  ansible.builtin.get_url:
    url: "{{ llm_models[item].url }}"
    dest: "{{ llm_models_dir }}/{{ llm_models[item].file }}"
    checksum: "sha256:{{ llm_models[item].sha256 }}"
    owner: root
    group: llama
    mode: "0640"
  loop: "{{ (llm_download + [llm_model]) | unique }}"
  notify: Restart llama-server

- name: Create the key directory
  ansible.builtin.file:
    path: "{{ llm_key_file | dirname }}"
    state: directory
    owner: root
    group: llama
    mode: "0750"

# force: false keeps the key from the first run.
- name: Generate the API key once
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits length=40') }}\n"
    dest: "{{ llm_key_file }}"
    owner: root
    group: llama
    mode: "0640"
    force: false
  no_log: true

- name: Install the llama-server unit
  ansible.builtin.template:
    src: llama-server.service.j2
    dest: /etc/systemd/system/llama-server.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart llama-server

- name: Enable and start llama-server
  ansible.builtin.systemd_service:
    name: llama-server
    enabled: true
    state: started
    daemon_reload: true

# Run a pending restart now, so the checks below see the final process.
- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

# /health answers 503 while the model loads; CPU loading can take minutes.
- name: Wait for the model to load
  ansible.builtin.uri:
    url: "http://{{ llm_bind }}:{{ llm_port }}/health"
  register: llm_health
  until: llm_health.status == 200
  retries: 60
  delay: 5

- name: Read the API key
  ansible.builtin.slurp:
    src: "{{ llm_key_file }}"
  register: llm_key
  no_log: true

- name: Check the API accepts the key
  ansible.builtin.uri:
    url: "http://{{ llm_bind }}:{{ llm_port }}/v1/models"
    headers:
      Authorization: "Bearer {{ (llm_key.content | b64decode) | trim }}"
  no_log: true

- name: Check the API rejects a request without a key
  ansible.builtin.uri:
    url: "http://{{ llm_bind }}:{{ llm_port }}/v1/models"
    status_code: 401
