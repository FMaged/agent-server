---
- name: Check the model settings before changing the host
  ansible.builtin.assert:
    that:
      - llm_models is mapping and llm_models | length > 0
      - llm_model in llm_models
      - llm_wanted | difference(llm_models.keys() | list) | length == 0
      - llm_models.values() | map(attribute='file') | unique | list | length == llm_models | length
    fail_msg: >-
      llm_model and llm_download must be keys of llm_models
      ({{ llm_models.keys() | list | join(', ') }}), and no two entries may
      share a file name.
    quiet: true

# Every entry, not only the wanted ones, so a bad entry fails on the day it is
# added. Nothing on the host has changed yet.
- name: Check every catalog entry
  ansible.builtin.assert:
    that:
      - item.value is mapping
      - (item.value.file | default('')) is string
      - (item.value.file | default('')) is match('^[A-Za-z0-9][A-Za-z0-9._-]*[.]gguf$')
      - (item.value.file | default('')) is not search('-[0-9]{5}-of-[0-9]{5}[.]gguf$')
      - (item.value.url | default('')) is string
      - (item.value.url | default('')) is match('^https://[^ ]+$')
      - (item.value.sha256 | default('')) is string
      - (item.value.sha256 | default('')) is match('^[0-9a-f]{64}$')
      - (item.value.size | default(0)) is integer
      - (item.value.size | default(0)) > 0
    fail_msg: >-
      llm_models.{{ item.key }} is invalid. It needs file (a plain *.gguf name,
      not a split model), url (https://), sha256 (64 lowercase hex digits) and
      size (bytes, a whole number above 0).
    quiet: true
  loop: "{{ llm_models | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Create the llama user
  ansible.builtin.user:
    name: llama
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  register: llm_user

- name: Create the models directory
  ansible.builtin.file:
    path: "{{ llm_models_dir }}"
    state: directory
    owner: root
    group: llama
    mode: "0750"

# One sha256 read per file, reused below. A file there with other weights is a
# catalog mistake: overwriting it would destroy what a rollback needs.
- name: Check the model files already on the host
  ansible.builtin.stat:
    path: "{{ llm_models_dir }}/{{ llm_models[item].file }}"
    checksum_algorithm: sha256
  loop: "{{ llm_wanted }}"
  register: llm_files

- name: Refuse to overwrite a model file that holds other weights
  ansible.builtin.assert:
    that: not item.stat.exists or item.stat.checksum == llm_models[item.item].sha256
    fail_msg: >-
      {{ llm_models[item.item].file }} is on the host with a different sha256.
      Give the new revision its own key and file name in llm_models.
    quiet: true
  loop: "{{ llm_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Read the free space for the models
  ansible.builtin.command: df --output=avail -B1 {{ llm_models_dir }}
  register: llm_df
  changed_when: false
  check_mode: false

# The old model stays until the new one passes its checks, so both must fit.
- name: Check the new models fit on the disk
  ansible.builtin.assert:
    that: llm_need | int + llm_disk_reserve | int <= llm_free | int
    fail_msg: >-
      The download needs {{ llm_need | int | human_readable }} plus a
      {{ llm_disk_reserve | int | human_readable }} reserve, but only
      {{ llm_free | int | human_readable }} is free in {{ llm_models_dir }}.
    quiet: true
  vars:
    llm_missing: "{{ llm_files.results | rejectattr('stat.exists') | map(attribute='item') | list }}"
    llm_need: "{{ llm_missing | map('extract', llm_models, 'size') | sum }}"
    llm_free: "{{ llm_df.stdout_lines[-1] | trim }}"

# Only missing files are fetched. The container is recreated only when the
# compose file or the image changes, so an extra model does not interrupt it.
- name: Download the models
  ansible.builtin.get_url:
    url: "{{ llm_models[item].url }}"
    dest: "{{ llm_models_dir }}/{{ llm_models[item].file }}"
    checksum: "sha256:{{ llm_models[item].sha256 }}"
    owner: root
    group: llama
    mode: "0640"
  loop: "{{ llm_files.results | rejectattr('stat.exists') | map(attribute='item') | list }}"

- name: Set the model file rights
  ansible.builtin.file:
    path: "{{ llm_models_dir }}/{{ llm_models[item].file }}"
    owner: root
    group: llama
    mode: "0640"
  loop: "{{ llm_wanted }}"

- name: Create the key directory
  ansible.builtin.file:
    path: "{{ llm_key_file | dirname }}"
    state: directory
    owner: root
    group: llama
    mode: "0750"

# force: false keeps the key from the first run.
- name: Generate the API key once
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits length=40') }}\n"
    dest: "{{ llm_key_file }}"
    owner: root
    group: llama
    mode: "0640"
    force: false
  no_log: true

# The copy above skips an existing key entirely, its rights too.
- name: Set the API key rights
  ansible.builtin.file:
    path: "{{ llm_key_file }}"
    owner: root
    group: llama
    mode: "0640"

- name: Create the compose directory
  ansible.builtin.file:
    path: "{{ llm_compose_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ llm_compose_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"

# The image is pinned by digest, so one already there never needs pulling
# again. Compose's own `--policy missing` pulls a digest every time, and reports
# a change, so look first.
- name: Look for the image
  ansible.builtin.command: docker image inspect --format {% raw %}'{{.Id}}'{% endraw %} {{ llm_image | quote }}
  register: llm_image_found
  changed_when: false
  failed_when: false
  check_mode: false

# Before the container is touched, so a failed pull leaves it serving.
- name: Pull the image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ llm_compose_dir }}"
  when: llm_image_found.rc != 0

# The source build's service holds the port the container needs. Its files stay
# until the checks pass, so a failed first container run can still go back to it.
- name: Look for the source build's unit
  ansible.builtin.stat:
    path: "{{ llm_old_unit_file }}"
  register: llm_old_unit

- name: Stop the source build's service
  ansible.builtin.systemd_service:
    name: llama-server
    state: stopped
    enabled: false
  when: llm_old_unit.stat.exists

# Compose compares the running container with the compose file and the image,
# and recreates it if they differ. So a file written by a run that stopped
# before this task is applied by the next run.
- name: Bring up the container
  community.docker.docker_compose_v2:
    project_src: "{{ llm_compose_dir }}"
    state: present

# /health answers 503 while the model loads; CPU loading can take minutes.
- name: Wait for the model to load
  ansible.builtin.uri:
    url: "http://{{ llm_bind }}:{{ llm_port }}/health"
  register: llm_health
  until: llm_health.status == 200
  retries: 60
  delay: 5

- name: Read the API key
  ansible.builtin.slurp:
    src: "{{ llm_key_file }}"
  register: llm_key
  no_log: true

- name: Check the API accepts the key
  ansible.builtin.uri:
    url: "http://{{ llm_bind }}:{{ llm_port }}/v1/models"
    headers:
      Authorization: "Bearer {{ (llm_key.content | b64decode) | trim }}"
  no_log: true

- name: Check the API rejects a request without a key
  ansible.builtin.uri:
    url: "http://{{ llm_bind }}:{{ llm_port }}/v1/models"
    status_code: 401

# /health only means the file loaded. This proves the model can answer before
# the old one is deleted. A reasoning model may fill only reasoning_content.
- name: Check the model answers a chat request
  ansible.builtin.uri:
    url: "http://{{ llm_bind }}:{{ llm_port }}/v1/chat/completions"
    method: POST
    headers:
      Authorization: "Bearer {{ (llm_key.content | b64decode) | trim }}"
    body_format: json
    body:
      messages: [{role: user, content: Say hi.}]
      max_tokens: 32
    timeout: "{{ llm_check_timeout }}"
  register: llm_chat
  no_log: true

- name: Check the reply is not empty
  ansible.builtin.assert:
    that: >-
      (llm_reply.content | default('', true) | trim | length > 0) or
      (llm_reply.reasoning_content | default('', true) | trim | length > 0)
    fail_msg: "{{ llm_model }} answered the chat request with no text."
    quiet: true
  vars:
    llm_reply: "{{ (llm_chat.json.choices | default([{}], true))[0].message | default({}) }}"

# Cleanup runs only after every check passed.
- name: Remove the source build's unit
  ansible.builtin.file:
    path: "{{ llm_old_unit_file }}"
    state: absent
  register: llm_old_unit_removed

- name: Reload systemd without the unit
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: llm_old_unit_removed is changed

- name: Remove the source build
  ansible.builtin.file:
    path: "{{ llm_old_src_dir }}"
    state: absent

# The old image is kept until the new one passes its checks, so a rollback
# pulls nothing.
- name: Remove the llama.cpp images other than llm_image
  ansible.builtin.shell: |
    set -euo pipefail
    keep=$(docker image inspect --format {% raw %}'{{.Id}}'{% endraw %} {{ llm_image | quote }})
    ids=$(docker image ls --quiet --no-trunc ghcr.io/ggml-org/llama.cpp | sort -u)
    for id in $ids; do
      if [ "$id" != "$keep" ]; then
        docker image rm "$id" >/dev/null
        echo "$id"
      fi
    done
  args:
    executable: /bin/bash
  register: llm_old_images
  changed_when: llm_old_images.stdout | length > 0

# Ansible owns this directory: a .gguf not in llm_wanted is removed. This runs
# last, so a new model that fails any check leaves the old file for a rollback.
- name: Find the model files on the host
  ansible.builtin.find:
    paths: "{{ llm_models_dir }}"
    patterns: "*.gguf"
  register: llm_present

- name: Remove the models that are no longer wanted
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ llm_present.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: item.path | basename not in wanted_files
  vars:
    wanted_files: "{{ llm_wanted | map('extract', llm_models, 'file') | list }}"
