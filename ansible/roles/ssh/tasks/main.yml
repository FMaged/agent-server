---
- name: Harden sshd
  ansible.builtin.copy:
    content: |
      # Managed by Ansible.
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    dest: /etc/ssh/sshd_config.d/20-agent-server.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
